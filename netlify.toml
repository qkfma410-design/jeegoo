# Netlify 배포 설정 (이 파일은 수정하지 않아도 됩니다)
[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo '정적 사이트 - 빌드 단계 없음'"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

[[headers]]
  for = "/seed-data.json"
  [headers.values]
    Cache-Control = "no-cache"
